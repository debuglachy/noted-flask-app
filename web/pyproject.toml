[project]
name = "app"
version = "1"
description = "Noted-Flask-App is a simple web app for writing notes from different devices into persistent storage."
dependencies = [
    "flask",
    "flask_login",
    "flask_ldap3_login",
    "gunicorn[http2]",
]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
