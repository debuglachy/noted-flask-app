name: Python package

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.10'
    - name: Get dependencies
      run: python -m pip install pre-commit
    - name: run pre-commit
      run: |
        git log -1 --pretty=%B HEAD^2 > /tmp/COMMIT_MSG
        pre-commit run --hook-stage commit-msg --commit-msg-filename /tmp/COMMIT_MSG
