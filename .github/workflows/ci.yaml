name: CI

on:
  push:
    branches: [main]

jobs:
  docker-build:
    uses: debuglachy/ops/.github/workflows/docker-build.yaml@main
    with:
      image_name: 'noted-flask-app'
  python-coverage:
    uses: debuglachy/ops/.github/workflows/python-coverage.yaml@main
    with:
      src_folder: '.'
  python-package:
    uses: debuglachy/ops/.github/workflows/python-package.yaml@main
    with:
      python_version: '3.10'
