name: CI

on:
  push:
    branches: [main]

jobs:
  call-increment-semver:
    permissions:
      contents: write
    uses: debuglachy/ops/.github/workflows/increment-semver.yaml@main
  
  call-python-package:
    permissions:
      contents: write
      pull-requests: write
    uses: debuglachy/ops/.github/workflows/python-package.yaml@main
    with:
      python_version: '3.13'
      src_folder: '.'
  
  call-docker-publish:
    needs: call-increment-semver
    permissions:
      contents: write
      packages: write
    uses: debuglachy/ops/.github/workflows/docker-publish.yaml@main
    with:
      image_name: 'noted-flask-app'
      image_registry: 'ghcr.io'
      app_version: ${{ needs.call-increment-semver.outputs.app_version }}
