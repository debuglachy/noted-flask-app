name: CI

on:
  push:
    branches: [main]

jobs:
  docker-build:
    uses: debuglachy/ops/labs/github/workflows/docker-build.yaml@v1
    with:
      image_name: 'noted-flask-app'
  python-coverage:
    uses: debuglachy/ops/labs/github/workflows/python-coverage.yaml@v1
    with:
      src_folder: '.'
  python-package:
    uses: debuglachy/ops/labs/github/workflows/python-coverage.yaml@v1
    with:
      python_version: '3.10'
